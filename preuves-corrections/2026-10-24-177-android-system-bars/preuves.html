$('shot').addEventListener('load',placePointer);new ResizeObserver(placePointer).observe($('stage'));
function show(){const s=data.steps[index];$('select').value=index;$('counter').textContent=(index+1)+' / '+data.steps.length;$('caption').textContent=s.correction+' · '+s.caption;$('expected').textContent=s.expected;$('observed').textContent=s.observed;$('badge').textContent={verified:'✓ Vérifié',failed:'✗ Échec',unverified:'○ Non vérifié'}[s.status];$('shot').hidden=s.imageIndex===undefined;$('technical').hidden=s.imageIndex!==undefined;if(s.imageIndex!==undefined){$('shot').src=data.images[s.imageIndex];$('shot').alt=s.caption}else $('technical').textContent='Preuve technique\n\n'+s.text;$('prev').disabled=index===0;$('next').disabled=index===data.steps.length-1;placePointer()}
function move(i){pause();index=Math.max(0,Math.min(data.steps.length-1,i));show()}
function play(){if(timer){pause();return}if(index===data.steps.length-1)index=0;show();$('play').textContent='Pause';timer=setInterval(()=>{if(index<data.steps.length-1){index++;show()}else pause()},data.seconds*1000)}
$('prev').onclick=()=>move(index-1);$('next').onclick=()=>move(index+1);$('play').onclick=play;$('select').onchange=e=>move(Number(e.target.value));$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('frame').requestFullscreen()}catch{$('counter').textContent='Plein écran indisponible ici ; ouvrir le fichier HTML.'}};$('shot').onclick=()=>{pause();$('large').src=$('shot').src;$('zoom').showModal()};$('close').onclick=()=>$('zoom').close();document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA','BUTTON'].includes(e.target.tagName)||$('zoom').open)return;if(e.key==='ArrowRight'){e.preventDefault();move(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();move(index-1)}if(e.code==='Space'){e.preventDefault();play()}});show();pause();
</script></html>
