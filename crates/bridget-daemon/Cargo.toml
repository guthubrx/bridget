[package]
name = "bridget-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bridget_daemon"
path = "src/lib.rs"

[features]
test-support = []

[[bin]]
name = "bridget"
path = "src/main.rs"

[dependencies]
bridget-core = { path = "../bridget-core" }
bridget-transport = { path = "../bridget-transport" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
uuid = { workspace = true }
rusqlite = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
sha2 = { workspace = true }
signal-hook = "0.3"
libc = "0.2"
# Le renderer doit compter les cellules du terminal (CJK/emoji), pas les scalaires Unicode.
unicode-width = "0.2"
maicie = { path = "../../plugins/maicie" }

[dev-dependencies]
bridget-core = { path = "../bridget-core" }
bridget-transport = { path = "../bridget-transport", features = ["test-support"] }
