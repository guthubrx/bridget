[package]
name = "bridget-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "bridget_daemon"
path = "src/lib.rs"

[features]
test-support = []

[[bin]]
name = "bridget"
path = "src/main.rs"

[dependencies]
bridget-core = { path = "../bridget-core" }
bridget-transport = { path = "../bridget-transport" }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
uuid = { workspace = true }
# Frontière décision 163 : même client minreq 3.0.0, loopback ou HTTPS
# rustls uniquement ; aucun second client HTTP ni mode TLS permissif.
minreq = { version = "=3.0.0", default-features = false, features = ["https-rustls"] }
# Même version que bridget-transport ; RPC natif T3 V2, sans TLS ni runtime async.
tungstenite = { version = "0.26.2", default-features = false, features = ["handshake"] }
rusqlite = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
sha2 = { workspace = true }
signal-hook = "0.3"
libc.workspace = true
# Le renderer doit compter les cellules du terminal (CJK/emoji), pas les scalaires Unicode.
unicode-width = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
bridget-core = { path = "../bridget-core" }
bridget-transport = { path = "../bridget-transport", features = ["test-support"] }
