<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser Bridget</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111; color: #f5f5f4; }
      main { width: min(34rem, calc(100% - 3rem)); }
      h1 { margin: 0 0 .75rem; font-size: 1.35rem; }
      p { margin: .65rem 0; color: #aaa; line-height: 1.55; }
      kbd { padding: .15rem .38rem; border: 1px solid #3a3a3a; border-radius: .35rem; background: #202020; color: #eee; font: .8rem ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <main>
      <h1>Browser Bridget</h1>
      <p>Cette zone est un navigateur Web isolé de la conversation, des agents et de leurs secrets.</p>
      <p>Saisis une adresse HTTPS dans la barre au-dessus, ou ouvre un lien depuis une conversation. Les actions de navigation restent ici.</p>
      <p><kbd>⌘L</kbd> place le curseur dans la barre d’adresse.</p>
    </main>
  </body>
</html>
