<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Navigation Browser</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
      body { margin: 0; background: #181818; color: #f5f5f4; }
      form { box-sizing: border-box; height: 52px; display: flex; align-items: center; gap: 7px; padding: 8px 10px; border-bottom: 1px solid #303030; }
      button { width: 29px; height: 29px; padding: 0; border: 0; border-radius: 7px; background: transparent; color: #d4d4d4; font-size: 17px; cursor: pointer; }
      button:hover, button:focus-visible { background: #303030; outline: none; }
      button[aria-label="Recharger"] { font-size: 16px; }
      button svg { display: block; width: 16px; height: 16px; margin: auto; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
      input { min-width: 0; flex: 1; height: 30px; padding: 0 10px; border: 1px solid #3d3d3d; border-radius: 8px; background: #242424; color: #f4f4f4; font: 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; outline: none; }
      input:focus { border-color: #5c84eb; box-shadow: 0 0 0 2px #315bb766; }
    </style>
  </head>
  <body>
    <form id="browser-form">
      <button type="button" data-action="back" aria-label="Page précédente" title="Page précédente">‹</button>
      <button type="button" data-action="forward" aria-label="Page suivante" title="Page suivante">›</button>
      <button type="button" data-action="reload" aria-label="Recharger" title="Recharger">↻</button>
      <input id="address" type="url" inputmode="url" autocomplete="url" spellcheck="false" placeholder="Saisir une adresse HTTPS" aria-label="Adresse HTTPS" />
      <button type="button" data-action="maximize" aria-label="Agrandir ou réduire le Browser" title="Agrandir ou réduire le Browser">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" /></svg>
      </button>
    </form>
    <script src="./browser-chrome.js"></script>
  </body>
</html>
