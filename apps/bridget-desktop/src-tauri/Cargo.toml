[package]
name = "bridget-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Client macOS Bridget à profils SSH et locaux"

# Le client est volontairement isolé du workspace serveur Bridget. Il possède
# ses dépendances GUI sans les imposer au daemon ni à ses tests.
[workspace]

[lib]
name = "bridget_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "bridget-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-notification = "2.3.3"
