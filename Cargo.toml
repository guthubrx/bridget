[workspace]
resolver = "2"
members = [
    "crates/bridget-core",
    "crates/bridget-transport",
    "crates/bridget-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
log = "0.4"
env_logger = "0.11"
libc = "0.2"
sha2 = "0.10"
